<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><link rel="manifest" href="/manifest.json"><title>AI Investment Terminal</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.top{padding:14px 16px;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center}.brand{color:#ff9d00;font-weight:800}.live{color:#62d67b;font-size:12px}.tabs{display:flex;overflow:auto;border-bottom:1px solid #333}.tab{padding:12px 16px;white-space:nowrap;color:#aaa;cursor:pointer}.tab.active{color:#ff9d00;background:#151515}.page{display:none;padding:14px}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#111;border:1px solid #292929;padding:12px;min-height:90px}.name{color:#aaa;font-size:11px}.price{font-size:22px;margin:8px 0}.up{color:#62d67b}.down{color:#ff6262}input,button{font:inherit}input{background:#0b0b0b;color:#fff;border:1px solid #333;padding:11px;width:100%}button{background:#ff9d00;border:0;padding:11px 14px;font-weight:800}.row{display:flex;gap:8px;margin-bottom:12px}.chart{height:300px;border:1px solid #292929;background:#0b0b0b;padding:10px}.news{padding:12px 0;border-bottom:1px solid #292929}.news a{color:#8bc5ff;text-decoration:none}.muted{color:#999;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.chart{height:240px}.top{position:sticky;top:0;background:#050505;z-index:5}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand">AITERM</div><div id="status" class="live">● CONNECTING</div></div><div class="tabs"><div class="tab active" data-p="markets">MARKETS</div><div class="tab" data-p="valuation">VALUATION</div><div class="tab" data-p="breadth">BREADTH</div><div class="tab" data-p="news">NEWS</div></div><main><section id="markets" class="page active"><h3>LIVE MARKETS</h3><div id="marketGrid" class="grid"></div></section><section id="valuation" class="page"><h3>HISTORICAL P/E</h3><div class="row"><input id="peTicker" value="AAPL"><button onclick="loadPE()">LOAD</button></div><div id="peChart" class="chart"></div></section><section id="breadth" class="page"><h3>MARKET BREADTH</h3><div class="card">Breadth engine: percentage of constituents above their 200-day moving average. This production module will be expanded from the live historical-price feed.</div></section><section id="news" class="page"><h3>FINANCIAL NEWS</h3><div class="row"><input id="newsTicker" value="AAPL,MSFT,NVDA"><button onclick="loadNews()">LOAD</button></div><div id="newsList"></div></section></main><script>document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.page').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.p).classList.add('active');if(t.dataset.p==='news')loadNews()});function esc(x){return String(x??'').replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))}async function loadMarkets(){try{let r=await fetch('/api/markets?symbols=AAPL,MSFT,NVDA,SPY,QQQ,TSLA');let d=await r.json();if(!r.ok)throw Error(d.error||'API error');document.getElementById('status').textContent='● LIVE DATA';document.getElementById('marketGrid').innerHTML=d.map(x=>`<div class="card"><div class="name">${esc(x.symbol)}</div><div class="price">${esc(x.price)}</div><div class="${Number(x.changePercentage)>=0?'up':'down'}">${esc(x.changePercentage)}%</div></div>`).join('')||'<div class="muted">No quote data returned.</div>'}catch(e){document.getElementById('status').textContent='● API OFFLINE';document.getElementById('marketGrid').innerHTML='<div class="card">Configure FMP_API_KEY in Render.</div>'}}async function loadNews(){let q=document.getElementById('newsTicker').value;let r=await fetch('/api/news?symbols='+encodeURIComponent(q));let d=await r.json();document.getElementById('newsList').innerHTML=Array.isArray(d)?d.map(n=>`<div class="news"><b>${esc(n.title)}</b><div class="muted">${esc(n.publishedDate||n.date||'')}</div>${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">Open article</a>`:''}</div>`).join(''):'<div class="card">'+esc(d.error||'No news')+'</div>'}async function loadPE(){let s=document.getElementById('peTicker').value.trim();let r=await fetch('/api/pe/'+encodeURIComponent(s));let d=await r.json();if(!Array.isArray(d)||!d.length){document.getElementById('peChart').innerHTML='No P/E history returned.';return}let vals=d.slice().reverse(),max=Math.max(...vals.map(x=>Number(x.pe))),w=700,h=260,p=25;let pts=vals.map((x,i)=>`${p+i*(w-2*p)/Math.max(1,vals.length-1)},${h-p-(Number(x.pe)/max)*(h-2*p)}`).join(' ');document.getElementById('peChart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><polyline points="${pts}" fill="none" stroke="#ff9d00" stroke-width="3"/></svg><div class="muted">${vals.map(x=>esc(x.date)+': '+Number(x.pe).toFixed(1)+'x').join(' · ')}</div>`}loadMarkets();setInterval(loadMarkets,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
