services:
  - type: web
    name: ai-investment-terminal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FMP_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.5
